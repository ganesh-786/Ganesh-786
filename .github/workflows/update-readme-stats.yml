name: Update Profile Stats

# Regenerates the GitHub stats & top-languages cards as static SVG files
# and commits them straight into this repo, so the README never depends
# on the shared public github-readme-stats.vercel.app instance.

on:
  schedule:
    - cron: "0 0 * * *"      # runs once a day at 00:00 UTC
  workflow_dispatch:           # lets you trigger it manually from the Actions tab
  push:
    branches: [master]
    paths:
      - .github/workflows/update-readme-stats.yml

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Ganesh-786&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Ganesh-786&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update profile stats [skip ci]"
          git push
